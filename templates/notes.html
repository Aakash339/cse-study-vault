<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes - CSE Study Vault</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="particles"></div>

<div class="dashboard-card">

    <h2>📘 Notes</h2>
    <p class="tagline">Uploaded notes and study materials</p>

    <div class="semester-grid">

        {% for item in materials %}

        <a href="/view-file/{{ item[3] }}" target="_blank" class="semester-card">

            {{ item[0] }}

            <br>

            <small>
                {{ item[1] }} | {{ item[2] }}
            </small>

        </a>

        {% endfor %}

    </div>

    <a href="/resources" class="back-link">← Back</a>

</div>

</body>
</html>
