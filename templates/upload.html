<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Material</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="particles"></div>

<div class="admin-login-card">

    <h2>Upload Material</h2>
    <p class="tagline">Upload study resources</p>

    <form action="/upload" method="POST" enctype="multipart/form-data">

        <input type="text" name="title" placeholder="Material Title" required>

        <!-- Semester Dropdown -->
        <select name="semester" id="semester" required onchange="loadSubjects()">

            <option value="">Select Semester</option>

            {% for sem in semesters %}
            <option value="{{ sem[0] }}">{{ sem[0] }}</option>
            {% endfor %}

        </select>

        <!-- Subject Dropdown -->
        <select name="subject" id="subject" required>

            <option value="">Select Subject</option>

        </select>

        <!-- Resource Type -->
        <select name="resource_type" required>

            <option value="">Select Resource Type</option>

            <option>Notes</option>
            <option>PYQs</option>
            <option>Lab Programs</option>
            <option>Important Questions</option>

        </select>

        <!-- File Upload -->
        <input type="file" name="file" required>

        <button type="submit" class="btn">Upload</button>

    </form>

    <a href="/admin-panel" class="back-link">← Back</a>

</div>


<script>
function loadSubjects() {
    const semester = document.getElementById("semester").value;
    const subjectDropdown = document.getElementById("subject");

    subjectDropdown.innerHTML = '<option value="">Select Subject</option>';

    if (semester === "") {
        return;
    }

    fetch("/get-subjects/" + semester)
        .then(response => response.json())
        .then(data => {
            data.subjects.forEach(subject => {
                let option = document.createElement("option");
                option.value = subject;
                option.textContent = subject;
                subjectDropdown.appendChild(option);
            });
        });
}


</script>

</body>
</html>
