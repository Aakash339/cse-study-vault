<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uploaded Resources</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="particles"></div>

<div class="admin-panel-card">

    <h2>Uploaded Resources</h2>
    <p class="tagline">View all uploaded study materials</p>

    <div class="admin-options">

        {% for item in materials %}
        <div class="admin-option-card">

            <strong>{{ item[1] }}</strong>

            <br><br>

            <small>
                {{ item[2] }} | {{ item[3] }}
                <br>
                {{ item[4] }}
            </small>

            <br><br>

            <a href="{{ url_for('static', filename='uploads/' + item[5]) }}"
               target="_blank"
               class="back-link">

               Open File

            </a>

            <br><br>
            <a href="/edit-material/{{ item[0] }}" class="back-link">
                Edit
            </a>

            <br><br>

            <a href="/delete-material/{{ item[0] }}"
               class="back-link"
               onclick="return confirm('Are you sure you want to delete this material?')">

               Delete

            </a>

        </div>
        {% endfor %}

    </div>

    <a href="/admin-panel" class="back-link">
        ← Back to Admin Panel
    </a>

</div>

</body>
</html>
