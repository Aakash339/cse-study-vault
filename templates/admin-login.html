<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - CSE Study Vault</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="particles"></div>

<div class="admin-login-card">

    <img src="{{ url_for('static', filename='logo.jpeg') }}" alt="Logo" class="logo">

    <h2>Admin Login</h2>
    <p class="tagline">Restricted access for content management</p>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <p class="success-msg">{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/admin-login" method="POST">

        <input type="email" name="email" placeholder="Admin Email" required>

        <input type="password" name="password" placeholder="Password" required>

        <button type="submit" class="btn">Login</button>

    </form>

    <a href="/" class="back-link">← Back to Home</a>

</div>

<script>
setTimeout(function() {
    let messages = document.querySelectorAll(".success-msg");

    messages.forEach(function(msg) {
        msg.style.display = "none";
    });

}, 3000);
</script>

</body>
</html>
