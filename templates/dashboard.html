<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - CSE Study Vault</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="particles"></div>

<div class="dashboard-card">

    <img src="{{ url_for('static', filename='logo.jpeg') }}" class="logo" alt="logo">

    <h2>Choose Your Semester</h2>
    <p class="tagline">Access organized study materials</p>

    <div class="semester-grid">

        {% for sem in semesters %}
        <a href="/semester/{{ sem[0] }}" class="semester-card">
            {{ sem[0] }}
        </a>
        {% endfor %}

    </div>

    <a href="/" class="back-link">← Back</a>

</div>

</body>
</html>
